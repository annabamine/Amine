name: Keep Streamlit App Alive (30 min)

on:
  schedule:
    - cron: '0 */6 * * *'  # Toutes les 6 heures (00h, 06h, 12h, 18h)
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up app
        run: |
          curl -sSf -o /dev/null -w "Ping 1: %{http_code}\n" https://mini-valorisation.streamlit.app/
          sleep 15  # Attendre le réveil
          curl -sSf -o /dev/null -w "Ping 2: %{http_code}\n" https://mini-valorisation.streamlit.app/
