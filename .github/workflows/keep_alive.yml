name: Keep Streamlit App Alive

on:
  schedule:
    # S'exécute automatiquement tous les jours à 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de le lancer manuellement si besoin

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Open Streamlit App
        run: |
          curl -sL https://mini-valorisation.streamlit.app/ > /dev/null
          echo "App pinged successfully!"
